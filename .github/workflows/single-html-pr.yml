name: Verify standalone HTML
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'vite*'
      - 'package.json'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (existing project issues tracked separately)
        id: lint
        run: pnpm run lint
        continue-on-error: true
      - name: Jest (existing application type errors tracked separately)
        id: tests
        run: pnpm test -- --runInBand --watch=false
        continue-on-error: true
      - run: pnpm run build
      - run: pnpm run build:single
      - name: Browser smoke test (Chromium file://)
        run: |
          npm install --prefix "$RUNNER_TEMP/bead-playwright" --no-save playwright@1.56.1
          "$RUNNER_TEMP/bead-playwright/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/bead-playwright/node_modules/playwright" node scripts/smoke-single-html.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bead-pattern-designer-single-html
          path: dist-single/bead-pattern-designer.html
          if-no-files-found: error
      - name: Enforce quality gates after build diagnostics
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" || "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "Lint or Jest failed; see earlier diagnostic steps."
            exit 1
          fi
